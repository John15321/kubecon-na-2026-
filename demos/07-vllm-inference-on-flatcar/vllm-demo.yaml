apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-demo
  template:
    metadata:
      labels:
        app: vllm-demo
    spec:
      containers:
        - name: vllm
          # Pin an exact tag before recording. :latest is fine for testing
          # but is not reproducible.
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 5
          # Model download (~1GB for this size) happens on first start --
          # generous startup window so the pod isn't killed mid-pull.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-demo
spec:
  selector:
    app: vllm-demo
  ports:
    - port: 8000
      targetPort: 8000
