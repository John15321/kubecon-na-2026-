apiVersion: v1
kind: ConfigMap
metadata:
  name: flatcar-demo-app-code
data:
  server.py: |
    import os
    import socket
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    count = 0

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            global count
            count += 1
            body = f"""<!DOCTYPE html>
    <html>
    <head><title>Hello from Flatcar</title></head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 8%;">
      <h1>Running on a Flatcar-powered Kubernetes node</h1>
      <p>Pod name: <b>{os.environ.get('POD_NAME', 'unknown')}</b></p>
      <p>Pod IP: <b>{os.environ.get('POD_IP', 'unknown')}</b></p>
      <p>Node: <b>{os.environ.get('NODE_NAME', 'unknown')}</b></p>
      <p>Requests served by this pod: <b>{count}</b></p>
      <p>Server time: {datetime.now(timezone.utc).isoformat()}</p>
    </body>
    </html>"""
            self.send_response(200)
            self.send_header("Content-Type", "text/html")
            self.end_headers()
            self.wfile.write(body.encode())

        def log_message(self, fmt, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flatcar-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flatcar-demo-app
  template:
    metadata:
      labels:
        app: flatcar-demo-app
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: flatcar-demo-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: flatcar-demo-app
spec:
  type: NodePort
  selector:
    app: flatcar-demo-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
